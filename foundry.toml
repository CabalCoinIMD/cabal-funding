[profile.default]
src = "src"
test = "test"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
libs = ["lib"]
auto_detect_remappings = false
remappings = ["@uniswap/v4-core/=lib/v4-core/", "@openzeppelin/contracts/=lib/openzeppelin-contracts/", "solmate/=lib/solmate/"]

[profile.default.fuzz]
runs = 512
